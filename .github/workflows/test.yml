name: Test
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          check-latest: true

      - name: Test
        run: go test -v -race ./...
